name: Lint, test, and build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  PUBLIC_HOST: http://localhost
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm 7.9.0 cannot read this repository's lockfile (lockfileVersion 9).
      # It warns and re-resolves every range from the registry, so the lint ran
      # against whatever prettier was newest -- 3.9.10 against
      # prettier-plugin-svelte 3.3.3, which throws `getVisitorKeys is not a
      # function` on every Svelte file. Installing what the lockfile pins fixes
      # that at the root, and --frozen-lockfile makes a drifted lockfile an
      # error rather than a silent upgrade.
      #
      # `cache: pnpm` replaces the hand-rolled ~/.pnpm-store cache, whose key
      # referenced `matrix.node-version` in a job with no matrix.
      - uses: pnpm/action-setup@v5
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
